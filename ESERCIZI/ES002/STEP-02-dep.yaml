apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: win2022-test
  namespace: test-corso
  labels:
    app: win2022-test
    version: v1
    environment: test
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/domain: win2022-test
    spec:
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 1
        memory:
          guest: 4Gi
        resources:
          requests:
            memory: 4Gi
        firmware:
          bootloader:
            efi:
              secureBoot: true
        devices:
          tpm: {}
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
            - name: windows-iso
              bootOrder: 2
              cdrom:
                bus: sata
            - name: virtio-drivers
              bootOrder: 3
              cdrom:
                bus: sata
          interfaces:
            - name: default
              model: virtio
              masquerade: {}          
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: win2022-iso-rootdisk-pvc
        - name: windows-iso
          dataVolume:
            name: win2022-iso
        - name: virtio-drivers
          containerDisk:
            image: quay.io/kubevirt/virtio-container-disk:latest
  
  dataVolumeTemplates:
    - metadata:
        name: win2022-iso-rootdisk-pvc
      spec:
        storage:
          resources:
            requests:
              storage: 80Gi
        source:
          blank: {}