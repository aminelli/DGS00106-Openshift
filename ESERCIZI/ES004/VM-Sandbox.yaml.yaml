apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: my-vm
  namespace: antonio-minelli-etlf-dev
spec:
  dataVolumeTemplates:
    - metadata:
        creationTimestamp: null
        name: my-vm-disk
      spec:
        source:
          pvc:
            name: debian-golden-trixie
            namespace: antonio-minelli-etlf-dev
        storage:
          resources:
            requests:
              storage: 2Gi
  runStrategy: Manual
  template:
    metadata:
      annotations:
        kubevirt.io/pci-topology-version: v3
      creationTimestamp: null
    spec:
      architecture: amd64
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
        firmware:
          serial: f39e1d6f-fb99-448f-8ff3-50222def389e
          uuid: 721e53b1-585f-4f3b-a028-36f50abfacc6
        machine:
          type: pc-q35-rhel9.6.0
        resources:
          limits:
            memory: 4Gi
          requests:
            memory: 4Gi
      tolerations:
        - effect: NoSchedule
          key: sandbox-cnv
          operator: Exists
      volumes:
        - dataVolume:
            name: my-vm-disk
          name: rootdisk
        - cloudInitNoCloud:
            userData: |
              #cloud-config
              chpasswd:
                expire: false
              password: redhat
              ssh_authorized_keys:
              - |
                ssh-rsa  sandbox@cnv
              user: developer
          name: cloudinitdisk

