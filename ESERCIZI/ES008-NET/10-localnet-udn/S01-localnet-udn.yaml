# ====================================================================
# J - Combinazione: web con localnet VLAN100 + UDN primaria + app/db solo UDN (D + E)
#
# Login nelle VM: utente debian / password cambiami (cambiala).
# Disco: containerDisk quay.io/containerdisks/debian:13 (effimero: ad ogni stop/restart la VM riparte da immagine pulita e cloud-init riesegue).
# Applica una sola alternativa alla volta: sono pensate per lo stesso lab e riusano gli stessi nomi (web, app, db).
# Namespace stack-prod: UDN primaria 10.100.0.0/24 per tutte le VM; web ha in piu' una NIC su VLAN100 (192.168.100.11) via CUDN localnet.
# Servono nodi con NIC reale (ens224) trunk VLAN100: NON per CRC. Aggiungi I-migration-network.yaml per la rete di migrazione.
# web ha due NIC: 'enp1s0' = UDN primaria (DHCP, default route), 'enp2s0' = VLAN100 (IP statico, niente gateway).
# web e' scritto per raggiungere app/db via /etc/hosts:
# Nomi DNS dei peer non garantiti su UDN primaria (dipende dalla release). Verifica: getent hosts app
# Se non risolve, leggi gli IP con 'oc get vmi -n <ns> -o wide' e nelle VM esegui:
#   sudo set-peer.sh app <IP-app>   (su web)   |   sudo set-peer.sh db <IP-db>   (su app)
#
# Apply   : oc apply -f J-combinato-localnet-udn.yaml
# Verifica: oc get udn,net-attach-def -n stack-prod ; oc get clusteruserdefinednetwork ; oc get vmi -n stack-prod -o wide
# Cleanup : oc delete -f J-combinato-localnet-udn.yaml
# ====================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: stack-prod
  labels:
    k8s.ovn.org/primary-user-defined-network: ""
    vlan-prod: "true"
---
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: ovs-br-vm-localnet
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  desiredState:
    interfaces:
    - name: br-vm-ovs
      type: ovs-bridge
      state: up
      ipv4:
        enabled: false
      ipv6:
        enabled: false
      bridge:
        allow-extra-patch-ports: true
        options:
          stp:
            enabled: false
        port:
        - name: ens224
    ovn:
      bridge-mappings:
      - localnet: vm-localnet
        bridge: br-vm-ovs
        state: present
---
apiVersion: k8s.ovn.org/v1
kind: UserDefinedNetwork
metadata:
  name: rete-prod
  namespace: stack-prod
spec:
  topology: Layer2
  layer2:
    role: Primary
    subnets: ["10.100.0.0/24"]
    ipam:
      lifecycle: Persistent
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: vlan100
spec:
  namespaceSelector:
    matchLabels:
      vlan-prod: "true"
  network:
    topology: Localnet
    localnet:
      role: Secondary
      physicalNetworkName: vm-localnet
      vlan:
        mode: Access
        access:
          id: 100
      ipam:
        mode: Disabled
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: stack-prod
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web
  namespace: stack-prod
spec:
  podSelector:
    matchLabels:
      tier: web
  policyTypes: [Ingress]
  ingress:
  - ports:
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-from-web
  namespace: stack-prod
spec:
  podSelector:
    matchLabels:
      tier: app
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: web
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-app
  namespace: stack-prod
spec:
  podSelector:
    matchLabels:
      tier: db
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: app
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: web
  namespace: stack-prod
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: stack-demo
        tier: web
    spec:
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 1Gi
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: podnet
            binding:
              name: l2bridge
          - name: vlan100
            bridge: {}
            model: virtio
            macAddress: "02:00:00:0a:01:02"
      networks:
      - name: podnet
        pod: {}
      - name: vlan100
        multus:
          networkName: vlan100
      volumes:
      - name: rootdisk
        containerDisk:
          image: quay.io/containerdisks/debian:13
          imagePullPolicy: IfNotPresent
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            hostname: web
            password: cambiami
            chpasswd: {expire: false}
            ssh_pwauth: true
            packages:
            - nginx
            write_files:
            - path: /etc/nginx/conf.d/stack.conf
              content: |
                server {
                  listen 80 default_server;
                  location / {
                    proxy_pass http://app:8080;
                  }
                }
            - path: /usr/local/bin/set-peer.sh
              permissions: '0755'
              content: |
                #!/bin/sh
                # uso: set-peer.sh <nome> <ip>   (es. set-peer.sh app 10.100.0.12)
                echo "$2 $1" >> /etc/hosts
                systemctl restart nginx app 2>/dev/null || true
            runcmd:
            - rm -f /etc/nginx/sites-enabled/default
            - systemctl restart nginx || true
          networkData: |
            version: 2
            ethernets:
              lan0:
                match:
                  name: "enp1s0"
                dhcp4: true
              vlan0:
                match:
                  macaddress: "02:00:00:0a:01:02"
                set-name: vlan0
                addresses: [192.168.100.11/24]
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: app
  namespace: stack-prod
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: stack-demo
        tier: app
    spec:
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 1Gi
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: podnet
            binding:
              name: l2bridge
      networks:
      - name: podnet
        pod: {}
      volumes:
      - name: rootdisk
        containerDisk:
          image: quay.io/containerdisks/debian:13
          imagePullPolicy: IfNotPresent
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            hostname: app
            password: cambiami
            chpasswd: {expire: false}
            ssh_pwauth: true
            write_files:
            - path: /opt/app.py
              content: |
                import socket
                from http.server import BaseHTTPRequestHandler, HTTPServer
                DB = "db"
                class H(BaseHTTPRequestHandler):
                    def do_GET(self):
                        try:
                            socket.create_connection((DB, 5432), 2).close()
                            st = "OK"
                        except Exception as e:
                            st = "KO (%s)" % e
                        body = ("app=%s -> db=%s : %s\n" % (socket.gethostname(), DB, st)).encode()
                        self.send_response(200)
                        self.end_headers()
                        self.wfile.write(body)
                HTTPServer(("0.0.0.0", 8080), H).serve_forever()
            - path: /etc/systemd/system/app.service
              content: |
                [Unit]
                Description=Stack demo app
                After=network-online.target
                Wants=network-online.target
                [Service]
                ExecStart=/usr/bin/python3 /opt/app.py
                Restart=always
                [Install]
                WantedBy=multi-user.target
            - path: /usr/local/bin/set-peer.sh
              permissions: '0755'
              content: |
                #!/bin/sh
                # uso: set-peer.sh <nome> <ip>   (es. set-peer.sh app 10.100.0.12)
                echo "$2 $1" >> /etc/hosts
                systemctl restart nginx app 2>/dev/null || true
            runcmd:
            - systemctl daemon-reload
            - systemctl enable --now app.service
          networkData: |
            version: 2
            ethernets:
              lan0:
                match:
                  name: "en*"
                dhcp4: true
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: db
  namespace: stack-prod
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: stack-demo
        tier: db
    spec:
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 1Gi
        devices:
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: podnet
            binding:
              name: l2bridge
      networks:
      - name: podnet
        pod: {}
      volumes:
      - name: rootdisk
        containerDisk:
          image: quay.io/containerdisks/debian:13
          imagePullPolicy: IfNotPresent
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            hostname: db
            password: cambiami
            chpasswd: {expire: false}
            ssh_pwauth: true
            packages:
            - postgresql
            write_files:
            - path: /usr/local/bin/db-setup.sh
              permissions: '0755'
              content: |
                #!/bin/sh
                D=$(ls -d /etc/postgresql/*/main | head -1)
                echo "listen_addresses = '*'" > $D/conf.d/listen.conf
                echo "host all all 0.0.0.0/0 scram-sha-256" >> $D/pg_hba.conf
                su postgres -c "psql -c \"ALTER USER postgres PASSWORD 'cambiami'\""
                systemctl restart postgresql
            - path: /usr/local/bin/set-peer.sh
              permissions: '0755'
              content: |
                #!/bin/sh
                # uso: set-peer.sh <nome> <ip>   (es. set-peer.sh app 10.100.0.12)
                echo "$2 $1" >> /etc/hosts
                systemctl restart nginx app 2>/dev/null || true
            runcmd:
            - /usr/local/bin/db-setup.sh
          networkData: |
            version: 2
            ethernets:
              lan0:
                match:
                  name: "en*"
                dhcp4: true
