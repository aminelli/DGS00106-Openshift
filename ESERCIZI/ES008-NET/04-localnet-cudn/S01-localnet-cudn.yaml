# ====================================================================
# D - Localnet OVN-Kubernetes con ClusterUserDefinedNetwork (alternativa dichiarativa a C)
#
# Login nelle VM: utente debian / password cambiami (cambiala).
# Disco: containerDisk quay.io/containerdisks/debian:13 (effimero: ad ogni stop/restart la VM riparte da immagine pulita e cloud-init riesegue).
# Applica una sola alternativa alla volta: sono pensate per lo stesso lab e riusano gli stessi nomi (web, app, db).
# Schema: web=VLAN100 192.168.100.11 | app=VLAN110 192.168.110.12 | db=VLAN120 192.168.120.13 (gateway .1 di ogni VLAN).
# Il routing e i permessi tra VLAN li fa il firewall fisico: consenti web->app TCP/8080 e app->db TCP/5432.
# Adatta NIC ('ens224'), VLAN, indirizzi e DNS al tuo ambiente. La NIC NON deve essere quella di br-ex (management).
# VM senza pod network: usa virtctl console/vnc. Servono nodi con NIC/trunk VLAN reali (non CRC).
# Senza uscita internet sulle VLAN i pacchetti (nginx, postgresql) non si installano: usa un'immagine con pacchetti o un proxy.
# Sui nodi serve solo il bridge-mapping (NNCP); una CUDN per VLAN compare come NAD nei namespace selezionati.
# Il supporto CUDN localnet dipende dalla release: oc explain clusteruserdefinednetwork.spec.network.localnet
# Prima di applicare: oc label namespace corso vlan-stack=true
#
# Apply   : oc label namespace corso vlan-stack=true ; oc apply -f D-localnet-cudn.yaml
# Verifica: oc get clusteruserdefinednetwork ; oc get net-attach-def -n corso ; oc get vmi -n corso -o wide
# Cleanup : oc delete -f D-localnet-cudn.yaml ; oc label namespace corso vlan-stack-
# ====================================================================
---
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: ovs-br-vm-localnet
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  desiredState:
    interfaces:
    - name: br-vm-ovs
      type: ovs-bridge
      state: up
      ipv4:
        enabled: false
      ipv6:
        enabled: false
      bridge:
        allow-extra-patch-ports: true
        options:
          stp:
            enabled: false
        port:
        - name: ens224
    ovn:
      bridge-mappings:
      - localnet: vm-localnet
        bridge: br-vm-ovs
        state: present
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: vlan100
spec:
  namespaceSelector:
    matchLabels:
      vlan-stack: "true"
  network:
    topology: Localnet
    localnet:
      role: Secondary
      physicalNetworkName: vm-localnet
      vlan:
        mode: Access
        access:
          id: 100
      ipam:
        mode: Disabled
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: vlan110
spec:
  namespaceSelector:
    matchLabels:
      vlan-stack: "true"
  network:
    topology: Localnet
    localnet:
      role: Secondary
      physicalNetworkName: vm-localnet
      vlan:
        mode: Access
        access:
          id: 110
      ipam:
        mode: Disabled
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: vlan120
spec:
  namespaceSelector:
    matchLabels:
      vlan-stack: "true"
  network:
    topology: Localnet
    localnet:
      role: Secondary
      physicalNetworkName: vm-localnet
      vlan:
        mode: Access
        access:
          id: 120
      ipam:
        mode: Disabled
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: web
  namespace: corso
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: stack-demo
        tier: web
    spec:
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 1Gi
        devices:
          autoattachPodInterface: false
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: vlan100
            bridge: {}
            model: virtio
            macAddress: "02:00:00:04:01:01"
      networks:
      - name: vlan100
        multus:
          networkName: vlan100
      volumes:
      - name: rootdisk
        containerDisk:
          image: quay.io/containerdisks/debian:13
          imagePullPolicy: IfNotPresent
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            hostname: web
            password: cambiami
            chpasswd: {expire: false}
            ssh_pwauth: true
            packages:
            - nginx
            write_files:
            - path: /etc/nginx/conf.d/stack.conf
              content: |
                server {
                  listen 80 default_server;
                  location / {
                    proxy_pass http://192.168.110.12:8080;
                  }
                }
            runcmd:
            - rm -f /etc/nginx/sites-enabled/default
            - systemctl restart nginx || true
          networkData: |
            version: 2
            ethernets:
              vlan0:
                match:
                  macaddress: "02:00:00:04:01:01"
                set-name: vlan0
                addresses: [192.168.100.11/24]
                routes:
                - to: 0.0.0.0/0
                  via: 192.168.100.1
                nameservers:
                  addresses: [192.168.100.1]
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: app
  namespace: corso
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: stack-demo
        tier: app
    spec:
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 1Gi
        devices:
          autoattachPodInterface: false
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: vlan110
            bridge: {}
            model: virtio
            macAddress: "02:00:00:04:02:01"
      networks:
      - name: vlan110
        multus:
          networkName: vlan110
      volumes:
      - name: rootdisk
        containerDisk:
          image: quay.io/containerdisks/debian:13
          imagePullPolicy: IfNotPresent
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            hostname: app
            password: cambiami
            chpasswd: {expire: false}
            ssh_pwauth: true
            write_files:
            - path: /opt/app.py
              content: |
                import socket
                from http.server import BaseHTTPRequestHandler, HTTPServer
                DB = "192.168.120.13"
                class H(BaseHTTPRequestHandler):
                    def do_GET(self):
                        try:
                            socket.create_connection((DB, 5432), 2).close()
                            st = "OK"
                        except Exception as e:
                            st = "KO (%s)" % e
                        body = ("app=%s -> db=%s : %s\n" % (socket.gethostname(), DB, st)).encode()
                        self.send_response(200)
                        self.end_headers()
                        self.wfile.write(body)
                HTTPServer(("0.0.0.0", 8080), H).serve_forever()
            - path: /etc/systemd/system/app.service
              content: |
                [Unit]
                Description=Stack demo app
                After=network-online.target
                Wants=network-online.target
                [Service]
                ExecStart=/usr/bin/python3 /opt/app.py
                Restart=always
                [Install]
                WantedBy=multi-user.target
            runcmd:
            - systemctl daemon-reload
            - systemctl enable --now app.service
          networkData: |
            version: 2
            ethernets:
              vlan0:
                match:
                  macaddress: "02:00:00:04:02:01"
                set-name: vlan0
                addresses: [192.168.110.12/24]
                routes:
                - to: 0.0.0.0/0
                  via: 192.168.110.1
                nameservers:
                  addresses: [192.168.110.1]
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: db
  namespace: corso
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: stack-demo
        tier: db
    spec:
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 1Gi
        devices:
          autoattachPodInterface: false
          disks:
          - name: rootdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: vlan120
            bridge: {}
            model: virtio
            macAddress: "02:00:00:04:03:01"
      networks:
      - name: vlan120
        multus:
          networkName: vlan120
      volumes:
      - name: rootdisk
        containerDisk:
          image: quay.io/containerdisks/debian:13
          imagePullPolicy: IfNotPresent
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            hostname: db
            password: cambiami
            chpasswd: {expire: false}
            ssh_pwauth: true
            packages:
            - postgresql
            write_files:
            - path: /usr/local/bin/db-setup.sh
              permissions: '0755'
              content: |
                #!/bin/sh
                D=$(ls -d /etc/postgresql/*/main | head -1)
                echo "listen_addresses = '*'" > $D/conf.d/listen.conf
                echo "host all all 0.0.0.0/0 scram-sha-256" >> $D/pg_hba.conf
                su postgres -c "psql -c \"ALTER USER postgres PASSWORD 'cambiami'\""
                systemctl restart postgresql
            runcmd:
            - /usr/local/bin/db-setup.sh
          networkData: |
            version: 2
            ethernets:
              vlan0:
                match:
                  macaddress: "02:00:00:04:03:01"
                set-name: vlan0
                addresses: [192.168.120.13/24]
                routes:
                - to: 0.0.0.0/0
                  via: 192.168.120.1
                nameservers:
                  addresses: [192.168.120.1]
